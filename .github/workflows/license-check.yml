name: SPDX Header Compliance Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-spdx-headers:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Check SPDX license headers in source files
        run: |
          EXCLUDE_DIRS="vendor|node_modules|storage|bootstrap|public|\.git|\.github"

          # File extensions to check for SPDX headers
          EXTENSIONS="php js ts css scss vue blade.php html"

          # SPDX license patterns allowed
          SPDX_PATTERN="SPDX-License-Identifier:\s*(GPL-3.0(-or-later)?|LicenseRef-Proprietary)"

          # Temp file to hold missing files
          MISSING_FILE_REPORT=missing_spdx_files.txt
          > "$MISSING_FILE_REPORT"

          # Find all files with matching extensions excluding excluded dirs
          find . -type f \( $(printf -- "-iname '*.%s' -o " $EXTENSIONS) -false \) \
            | grep -Ev "$EXCLUDE_DIRS" \
            | while read -r file; do
                if ! grep -qE "$SPDX_PATTERN" "$file"; then
                  echo "$file" >> "$MISSING_FILE_REPORT"
                fi
              done

          if [ -s "$MISSING_FILE_REPORT" ]; then
            echo "❌ The following files are missing SPDX license headers:"
            cat "$MISSING_FILE_REPORT"
            exit 1
          else
            echo "✅ All checked source files have valid SPDX license headers."
          fi

 