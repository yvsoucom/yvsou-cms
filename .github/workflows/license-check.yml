name: License Check Only

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-license:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Ruby (for licensee)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install licensee and jq
        run: |
          gem install licensee
          sudo apt-get update && sudo apt-get install -y jq rsync

      - name: Detect License (excluding vendor/, storage/, etc.)
        run: |
          echo "🔍 Running license detection with licensee"
          TMP_DIR=$(mktemp -d)
          rsync -a ./ "$TMP_DIR" \
            --exclude vendor \
            --exclude node_modules \
            --exclude public \
            --exclude storage \
            --exclude bootstrap/cache \
            --exclude .git \
            --exclude .github

          LICENSE=$(licensee detect "$TMP_DIR" --json | jq -r '.license.spdx_id')
          echo "📄 Detected license: $LICENSE"
          rm -rf "$TMP_DIR"

          if [[ "$LICENSE" != "GPL-3.0" && "$LICENSE" != "GPL-3.0-or-later" && "$LICENSE" != "LicenseRef-Proprietary" ]]; then
            echo "❌ License is not allowed. Found: $LICENSE"
            exit 1
          fi

 