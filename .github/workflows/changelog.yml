name: Laravel Changelog Generator
on:
  push:
    branches: [main]

jobs:
  changelog:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup environment
        id: setup
        run: |
          # Get current version with multiple fallbacks
          CURRENT_VERSION=$(php artisan --version 2>/dev/null | awk '{print $3}' || \
                            jq -r '.version' composer.json 2>/dev/null || \
                            echo "0.0.0")
          
          # Get previous version or initialize
          git fetch --tags
          if ! PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null); then
            git tag v0.0.0
            git push origin v0.0.0
            PREV_TAG="v0.0.0"
          fi
          
          # Write to environment files
          echo "CURRENT_VERSION=${CURRENT_VERSION}" >> $GITHUB_ENV
          echo "PREV_VERSION=${PREV_TAG#v}" >> $GITHUB_ENV
          
          # Create version comparison file
          echo "${PREV_TAG#v},${CURRENT_VERSION}" > versions.csv

      - name: Read versions safely
        id: versions
        run: |
          IFS=, read -r PREV CURRENT < versions.csv
          echo "prev=${PREV}" >> $GITHUB_OUTPUT
          echo "current=${CURRENT}" >> $GITHUB_OUTPUT

      - name: Generate changelog
        run: |
          {
            echo "# Changelog"
            echo "## v${{ steps.versions.outputs.prev }} → v${{ steps.versions.outputs.current }}"
            echo ""
            
            if [ "${{ steps.versions.outputs.prev }}" != "${{ steps.versions.outputs.current }}" ]; then
              echo "### Changes"
              git log \
                --pretty=format:"- %s (%%h)" \
                --no-merges \
                v${{ steps.versions.outputs.prev }}..HEAD 2>/dev/null || \
                echo "No changes detected"
            fi
            
            echo ""
            echo "### Version Info"
            echo "- Previous: \`v${{ steps.versions.outputs.prev }}\`"
            echo "- Current: \`v${{ steps.versions.outputs.current }}\`"
            echo "- Changes: $(git rev-list v${{ steps.versions.outputs.prev }}..HEAD --count 2>/dev/null || echo 0)"
          } > CHANGELOG.md

      - name: Commit changes
        if: steps.versions.outputs.prev != steps.versions.outputs.current
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add CHANGELOG.md
          git commit -m "📜 Changelog: v${{ steps.versions.outputs.prev }}→v${{ steps.versions.outputs.current }} [skip ci]"
          git push