name: License Compliance Check (REUSE)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  reuse-lint:
    name: Run REUSE Compliance Check
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v3

      - name: 🛠️ Install REUSE tool
        run: |
          sudo apt update
          sudo apt install -y reuse

      - name: 📝 Create .reuse/ignore file
        run: |
          mkdir -p .reuse
          echo "public/" > .reuse/ignore
          echo "resources/icons/" >> .reuse/ignore
          echo "resources/images/" >> .reuse/ignore
          echo "storage/" >> .reuse/ignore
          echo "bootstrap/cache/.gitignore" >> .reuse/ignore

      - name: 🧪 Run REUSE lint
        run: |
          echo "🔍 Running REUSE lint on main branch..."
          reuse lint
